name: Bootloader web uploader

on:
  push:
    branches: [main]
    paths:
      - extras/stm32_i2c_bootloader/webserial.html
      - extras/stm32_i2c_bootloader/test_webserial.cjs
      - extras/stm32_i2c_bootloader/serial_i2c_bridge/**
      - .github/workflows/bootloader-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'adafruit/Adafruit_seesawPeripheral' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check uploader file parsing and protocol
        run: node extras/stm32_i2c_bootloader/test_webserial.cjs
      - name: Prepare standalone uploader
        run: |
          mkdir -p _site/bootloader/serial_i2c_bridge
          cp extras/stm32_i2c_bootloader/webserial.html _site/bootloader/index.html
          cp extras/stm32_i2c_bootloader/serial_i2c_bridge/serial_i2c_bridge.ino _site/bootloader/serial_i2c_bridge/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
